eureka:
  client:
    register-with-eureka: false



spring:
  application:
    name: gateway
  cloud:
    gateway:
      global-cors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:4200"  # Spécifiez explicitement les origines autorisées
              - "ws://localhost:8222"    # Ajoutez d'autres domaines si nécessaire
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"
            allowCredentials: true

      discovery:
        locator:
          enabled: true
      routes:
        - id: administration
          uri: http://localhost:8080
          predicates:
            - Path=/admin/**
        - id: adherent
          uri: http://localhost:8090
          predicates:
            - Path=/adherent/**
        - id: auth
          uri: http://localhost:8060
          predicates:
            - Path=/api/auth/**
        - id: remb
          uri: http://localhost:8010
          predicates:
            - Path=/Remb/**
        - id: referentiel
          uri: http://localhost:8011
          predicates:
            - Path=/referentiel/**
        - id: Credits
          uri: http://localhost:8012
          predicates:
            - Path=/Credits/**
        - id : Cotis
          uri: http://localhost:8091
          predicates:
            - Path=/Cotis/**
        - id: Indimnite
          uri: http://localhost:8093
          predicates:
            - Path=/Indemnite/**

server:
  port: 8222


spring:
  application:
    name: Referentiel

  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://${SANTE_DB_HOST}:${SANTE_DB_PORT_NUMBER};databaseName=${SANTE_DB_NAME};encrypt=false;trustServerCertificate=true
    username: ${SANTE_DB_USER_NAME}
    password: ${SANTE_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.SQLServerDialect
    show-sql: true

  mvc:
    format:
      date: dd/MM/yyyy

  servlet:
    multipart:
      # logo d'une société : 5 Mo au plus (LogoSociete.TAILLE_MAX) ; la valeur par défaut de Spring est 1 Mo
      max-file-size: 5MB
      max-request-size: 6MB

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

server:
  port: 8007
  servlet:
    context-path: /referentiel

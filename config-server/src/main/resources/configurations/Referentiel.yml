spring:
  application:
    name: Referentiel
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@//127.0.0.1:1521/DB11G
    username: assur
    password: assur
  jpa:
    hibernate:
      ddl-auto: none
    database-platform:  org.hibernate.dialect.OracleDialect
    show-sql: true
  mvc:
    format:
      date: dd/MM/yyyy
eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

server:
  port: 8007
  servlet:
    context-path: /referentiel

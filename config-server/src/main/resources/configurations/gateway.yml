eureka:
  client:
    register-with-eureka: false

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors: # Fixed key name
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: # Use patterns for flexibility
              - "http://localhost" # Frontend origin
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600 # Added for pre-flight caching
      discovery:
        locator:
          enabled: true # Consider disabling if not using Eureka discovery
      routes:
        - id: administration
          uri: http://localhost:8001
          predicates:
            - Path=/admin/**
        - id: auth
          uri: http://localhost:8002
          predicates:
            - Path=/api/auth/**
        - id: adherent
          uri: http://localhost:8004
          predicates:
            - Path=/adherent/**
        - id: referentiel
          uri: http://localhost:8007
          predicates:
            - Path=/referentiel/**
        - id: remb
          uri: http://localhost:8008
          predicates:
            - Path=/Remb/**
        - id: Reports
          uri: http://localhost:8011
          predicates:
            - Path=/Print/**

        - id: communicationService
          uri: http://localhost:8014
          predicates:
            - Path=/Communication/**
        - id: communicationServiceWS
          uri: http://localhost:8014
          predicates:
            - Path=/communication-service/**
          filters:
            - RewritePath=/communication-service/?(?<segment>.*), /Communication/${segment}
server:
  port: 8222
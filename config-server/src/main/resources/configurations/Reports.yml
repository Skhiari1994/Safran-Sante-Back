spring:
  application:
    name: Reports

  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://${SANTE_DB_HOST}:${SANTE_DB_PORT_NUMBER};databaseName=${SANTE_DB_NAME};encrypt=false;trustServerCertificate=true
    username: ${SANTE_DB_USER_NAME}
    password: ${SANTE_DB_PASSWORD}
    
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.SQLServerDialect
    show-sql: true

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
      
server:
  port: 8011
  servlet:
    context-path: /Print
